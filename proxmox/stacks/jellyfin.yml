version: '3.5'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - '8096:8096'
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/win_media:/media # 👈 Esta línea conecta los dibujos de Windows con Jellyfin

volumes:
  jellyfin_config:
  jellyfin_cache:
