# ==============================================================================
# jellyseerr.yml — Jellyseerr (gestor de solicitudes de media)
# ==============================================================================
version: '3.8'

services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=0
      - PGID=0
      - LOG_LEVEL=info
      - TZ=America/Asuncion
    ports:
      - '5055:5055'
    volumes:
      - jellyseerr_config:/app/config
    restart: unless-stopped

volumes:
  jellyseerr_config:
