# ==============================================================================
# security-stack.yml — AdGuard Home + Vaultwarden
# NOTA: AdGuard usa 8082:8082 (puerto interno configurado en el wizard)
# ==============================================================================
version: '3.8'

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '8082:8082/tcp'
      - '3000:3000/tcp'
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    restart: always

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - WEBSOCKET_ENABLED=true
      - TZ=America/Asuncion
    ports:
      - '8081:80'
    volumes:
      - vaultwarden_data:/data
    restart: unless-stopped

volumes:
  adguard_work:
  adguard_conf:
  vaultwarden_data:
